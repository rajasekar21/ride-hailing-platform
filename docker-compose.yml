services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  user:
    build:
      context: ./services
      dockerfile: user/Dockerfile
    container_name: user
    environment:
      - DB_PATH=/data/users.db
      - DATASET_FILE=/dataset/users.csv
    command: sh -c "node seed.js && node app.js"
    volumes:
      - user_data:/data
      - ./dataset:/dataset:ro
    ports:
      - "3001:3000"

  driver:
    build:
      context: ./services
      dockerfile: driver/Dockerfile
    container_name: driver
    environment:
      - DB_PATH=/data/drivers.db
      - DATASET_FILE=/dataset/drivers.csv
    command: sh -c "node seed.js && node app.js"
    volumes:
      - driver_data:/data
      - ./dataset:/dataset:ro
    ports:
      - "3002:3000"

  ride:
    build:
      context: ./services
      dockerfile: ride/Dockerfile
    container_name: ride
    environment:
      - DB_PATH=/data/rides.db
      - DATASET_FILE=/dataset/trips.csv
      - DRIVER_SERVICE_URL=http://driver:3000
      - PAYMENT_SERVICE_URL=http://payment:3000
      - NOTIFICATION_SERVICE_URL=http://notification:3000
      - CANCELLATION_FEE=30
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - EVENTS_EXCHANGE=ride.events
      - JWT_SECRET=ILoveIndia
    command: sh -c "node seed.js && node app.js"
    depends_on:
      - rabbitmq
      - driver
      - payment
      - notification
    volumes:
      - ride_data:/data
      - ./dataset:/dataset:ro
    ports:
      - "3000:3000"

  payment:
    build:
      context: ./services
      dockerfile: payment/Dockerfile
    container_name: payment
    environment:
      - DB_PATH=/data/payments.db
      - DATASET_FILE=/dataset/payments.csv
      - TRIP_SERVICE_URL=http://ride:3000
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - EVENTS_EXCHANGE=ride.events
      - PAYMENT_QUEUE=payment.queue
    command: sh -c "node seed.js && node app.js"
    depends_on:
      - rabbitmq
    volumes:
      - payment_data:/data
      - ./dataset:/dataset:ro
    ports:
      - "3003:3000"

  rating:
    build:
      context: ./services
      dockerfile: rating/Dockerfile
    container_name: rating
    environment:
      - DB_PATH=/data/ratings.db
      - DATASET_FILE=/dataset/ratings.csv
      - TRIP_SERVICE_URL=http://ride:3000
    command: sh -c "node seed.js && node app.js"
    depends_on:
      - ride
    volumes:
      - rating_data:/data
      - ./dataset:/dataset:ro
    ports:
      - "3005:3000"

  notification:
    build:
      context: ./services
      dockerfile: notification/Dockerfile
    container_name: notification
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - EVENTS_EXCHANGE=ride.events
      - NOTIFICATION_QUEUE=notification.queue
    depends_on:
      - rabbitmq
    ports:
      - "3004:3000"

  auth:
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    container_name: auth
    environment:
      - JWT_SECRET=ILoveIndia
      - USER_SERVICE_URL=http://user:3000
      - DRIVER_SERVICE_URL=http://driver:3000
    ports:
      - "3006:3000"

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    depends_on:
      - user
      - driver
      - ride
      - payment
      - rating
    ports:
      - "5173:3000"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3007:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  user_data:
  driver_data:
  ride_data:
  payment_data:
  rating_data:
  grafana_data:
