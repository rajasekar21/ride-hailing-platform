name: Verify OpenAPI Generation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install docs API dependencies
        working-directory: docs/api
        run: npm ci

      - name: Regenerate OpenAPI from code
        working-directory: docs/api
        run: npm run generate:openapi

      - name: Ensure generated spec is committed
        run: |
          if ! git diff --exit-code -- docs/api/openapi.json; then
            echo "docs/api/openapi.json is out of date."
            echo "Run: cd docs/api && npm run generate:openapi"
            exit 1
          fi
