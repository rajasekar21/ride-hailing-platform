server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/user/ {
    proxy_pass http://user:3000/;
  }

  location /api/driver/ {
    proxy_pass http://driver:3000/;
  }

  location /api/ride/ {
    proxy_pass http://ride:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /socket.io/ {
    proxy_pass http://ride:3000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /api/payment/ {
    proxy_pass http://payment:3000/;
  }

  location /api/rating/ {
    proxy_pass http://rating:3000/;
  }
}
